[project]
name = "mlvc"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch==2.10.0",
    "triton-windows>=3.6,<3.7; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "torchao",
    # Data & utilities
    "tqdm",
    "tabulate",
    "pandas",
    "scipy",
    "matplotlib",
    "dataclasses-json",
    # ONNX / model conversion
    "onnx",
    "onnxscript",
    "onnxconverter_common",
    "coremltools",
    # Azure
    "cryptography<=46.0.3; sys_platform == 'win32' and platform_machine == 'ARM64'", # Latest versions missing ARM64 Windows wheels
    "azure-identity",
    "azure-storage-blob",
    "azure-ai-ml",
    "azureml-mlflow",
    "mlflow-skinny",
    # Not available for ARM64 Windows
    "lpips; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "opencv-python==4.11.0.86; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "sentencepiece; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "transformers>=5.14.1,<6; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "pyfacer; sys_platform != 'win32' or platform_machine != 'ARM64'",
]

[project.optional-dependencies]
onnxruntime = ["onnxruntime"]
onnxruntime-gpu = [
    "onnxruntime-gpu; sys_platform == 'linux' or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
onnxruntime-openvino = [
    "onnxruntime-openvino==1.24.1; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "openvino==2025.4.1; sys_platform == 'win32' and platform_machine == 'AMD64'",
]
onnxruntime-qnn = [
    "onnxruntime-qnn==1.24.4; sys_platform == 'win32' and platform_machine == 'ARM64'",
]
onnxruntime-windowsml = [
    "winrt-Windows.Foundation; sys_platform == 'win32'",
    "winrt-Windows.ApplicationModel; sys_platform == 'win32'",
    "wasdk-Microsoft.Windows.AI.MachineLearning==1.8.*; sys_platform == 'win32'",
    "wasdk-Microsoft.Windows.ApplicationModel.DynamicDependency.Bootstrap==1.8.*; sys_platform == 'win32'",
]

[dependency-groups]
ci = [
    "pytest",
    "ty",
    "ruff",
    "pre-commit",
    "pre-commit-hooks",
    "python-dotenv",
]
dev = [
    { include-group = "ci" },
    "jupyterlab",
]

[tool.uv]
package = false
conflicts = [
    [
        { extra = "onnxruntime" },
        { extra = "onnxruntime-gpu" },
        { extra = "onnxruntime-qnn" },
        { extra = "onnxruntime-openvino" },
        { extra = "onnxruntime-windowsml" },
    ],
]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'win32' and platform_machine == 'ARM64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32' and platform_machine != 'AMD64'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32' and platform_machine != 'AMD64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
extend-exclude = ["video/src/vsr", "video/src/metrics/deqa"]

[tool.ruff.lint]
ignore = [
    "LOG015", # Root logger is the project convention (the log format has no logger name)
    "TRY004", # Invalid config types raise ValueError by design (tests rely on it)
    "BLE001", # Broad excepts are deliberate: per-item error handling, cross-thread exception forwarding
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["conversion.types.RuntimeParams", "src.utils.rate_controller.RateModelParams"]

[tool.ruff.lint.isort]
known-first-party = [
    "src",
    "conversion",
    "tests",
    "compare_rd_video",
    "compute_benchmark_metrics",
    "process_P910_results",
    "run_basicvsrpp",
    "test_conversion",
    "train_video",
]
combine-as-imports = true

[tool.ty.src]
include = ["video"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    "venv",
    "video/src/vsr",
    "video/src/metrics/deqa",
    "video/src/models/legacy",
    "video/src/utils/flow_tester.py",
    "packages/msrtc_rans/python/src",
]

[tool.ty.environment]
python-platform = "all"
root = ["video"]
extra-paths = ["packages/msrtc_rans/python/src"]

[tool.ty.analysis]
replace-imports-with-any = ["onnxruntime", "onnxruntime.**", "openvino", "openvino.**", "winui3", "winui3.**"]
allowed-unresolved-imports = ["cv2.**", "facer.**", "lpips.**", "skimage.**", "torchvision.**"]

[tool.ty.rules]
incompatible-method-override = "ignore"
incompatible-attribute-override = "ignore"
lost-keyword-for-regular-parameter = "ignore"

[[tool.ty.overrides]]
include = [
    "video/conversion/__init__.py",
    "video/conversion/_exporter/__init__.py",
    "video/conversion/_exporter/_base_exporter.py",
    "video/conversion/_scale_decoder.py",
    "video/src/utils/common.py",
    "video/src/utils/model_factory.py",
    "video/train_optic_flow.py",
]

[tool.ty.overrides.analysis]
allowed-unresolved-imports = [
    "conversion._exporter._coreml_ext",
    "conversion._scale_decoder_ext",
    "conversion._types_ext",
    "src.models.legacy.video_net",
    "src.utils.model_factory_ext",
    "src.vsr.auto_avsr.api",
]

[[tool.ty.overrides]]
include = ["video/conversion/_exporter/_coreml_utils.py", "video/notebooks/coreml_act_precision.ipynb"]
rules = { missing-attribute = "ignore" }

[[tool.ty.overrides]]
include = ["video/conversion/_split_model/**"]
rules = { mismatched-type-name = "ignore" }
