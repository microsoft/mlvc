# Model Configurations Example
# ============================
# Copy this file to model_configs.yaml and configure your weights paths.

# -----------------------------------------------------------------------------
# DMC 6.1SB models
# -----------------------------------------------------------------------------

dmc61sbr_lrelu:
  module: ._dmc61sb_model
  class: TraceableMLVC
  weights_path: null  # TODO: Set path to your weights
  weights_version: null  # TODO: Set version string
  iframe_period: 128
  reset_period: null
  split_type: dmc61sbr_e1d1
  params:
    disable_feature_reset: true
    depth_conv_block_params:
      activation: LeakyReLU
      zero_init_residual: true
    feature_channels: 128
    spatial_prior_channels: 256
    input_offset: -0.5
    memory_activation: identity

dmc61sb_lrelu:
  module: ._dmc61sb_model
  class: TraceableMLVC
  weights_path: null  # TODO: Set path to your weights
  weights_version: null  # TODO: Set version string
  iframe_period: 128
  reset_period: 64
  split_type: dmc61sb_e2d1
  params:
    depth_conv_block_params:
      activation: LeakyReLU

dmc61sbr_reglu:
  module: ._dmc61sb_model
  class: TraceableMLVC
  weights_path: pretrained/mlvc-psnr-v1.ckpt
  weights_version: mlvc-psnr-v1
  iframe_period: 64
  reset_period: null
  split_type: dmc61sbr_e1d1
  params:
    disable_feature_reset: true
    depth_conv_block_params:
      activation: LeakyReLU
      zero_init_residual: true
      chunk_mode: gated
      ffn_gate_activation: ReLU1
    feature_channels: 128
    spatial_prior_channels: 256
    input_offset: -0.5
    memory_activation: identity
    chain_feature_adaptors: true

